services:
  gotify:
    image: gotify/server:latest
    container_name: gotify
    volumes:
      - /home/linuxadmin/docker/gotify:/app/data
    ports:
      - 90:80
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    restart: unless-stopped


