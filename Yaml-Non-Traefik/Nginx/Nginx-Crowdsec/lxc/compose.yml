services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      # These ports are in format <host-port>:<container-port>
      - "${NPM_HTTP_PORT}:80"
      - "${NPM_HTTPS_PORT}:443"
      - "${NPM_ADMIN_PORT}:81"
      # Add any other Stream port you want to expose
      # - '21:21' # FTP
    environment:
      # Mysql/Maria connection parameters:
      DB_MYSQL_HOST: ${NPM_DB_HOST}
      DB_MYSQL_PORT: ${NPM_DB_PORT}
      DB_MYSQL_USER: ${NPM_DB_USER}
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
      DB_MYSQL_NAME: ${NPM_DB_NAME}
      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'
    volumes:
      - ${NPM_LOGS_PATH}:/var/log/nginx
      - ${NPM_DATA_PATH}:/data
      - ${NPM_LETSENCRYPT_PATH}:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    depends_on:
      - db
    networks:
      - proxy
      - internal

  db:
    image: 'jc21/mariadb-aria:latest'
    container_name: nginx-proxy-manager-db
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_AUTO_UPGRADE: ${MARIADB_AUTO_UPGRADE}
    volumes:
      - ${NPM_DATA_PATH}/mysql:/var/lib/mysql
    networks:
      - internal

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: always
    ports:
     - 127.0.0.1:8080:8080
    environment:
      COLLECTIONS: ${COLLECTIONS}
      PGID: ${GID}
      PUID: ${PUID}
    networks:
      - proxy
      - internal
#    depends_on:
#     - proxy
    volumes:
      # Persistent config and database
      - ${CROWDSEC_CONFIG_PATH}:/etc/crowdsec
      - ${CROWDSEC_DB_PATH}:/var/lib/crowdsec/data
      # Nginx logs (read-only)
      - ${NPM_LOGS_PATH}:/var/log/nginx:ro
      # Acquisition configs
      - ${CROWDSEC_ACQUIS_PATH}:/etc/crowdsec/acquis.d:ro
      # Bouncers
      - ${CROWDSEC_BOUNCERS_PATH}:/etc/crowdsec/bouncers

networks:
  proxy:
    driver: bridge

  internal:
    driver: bridge
    internal: true
