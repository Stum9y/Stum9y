services:
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:latest
    volumes:
      - /home/linuxadmin/docker/vaultwarden/:/data/
    ports:
      - 88:80
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

